# Dependency checks run by the CI (`cargo deny check`).

[graph]
# The systems Serafind is built for.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[advisories]
# Known vulnerabilities and unmaintained crates (RustSec) fail the check, except these, which
# come through libraries Serafind cannot change. Review them when those libraries are updated.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: from the GTK libraries of tray-icon, which are Linux-only, while Serafind uses tray-icon on Windows only: never built" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5: from egui's accessibility (accesskit, zbus 5); goes away when egui moves to zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4: same as zvariant" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5: same as zvariant" },
]

[licenses]
# Licenses that can be shipped with an Apache-2.0 application.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
]
confidence-threshold = 0.9
# The fonts built into egui (the binary ships them): free to embed and redistribute.
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
# The same crate in several versions only warns: some come from the GUI libraries.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io.
unknown-registry = "deny"
unknown-git = "deny"
