name: Idea
description: A new feature or an improvement.
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What you would like to do
      description: The need first, then the solution you have in mind if any.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you do it today
