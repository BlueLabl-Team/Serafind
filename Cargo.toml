[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/serafind"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/BlueLabl-Team/Serafind"
authors = ["BlueLabl"]

[workspace.dependencies]
serafind-core = { path = "crates/serafind-core" }
serafind-index = { path = "crates/serafind-index" }
serafind-settings = { path = "crates/serafind-settings" }
serafind-ipc = { path = "crates/serafind-ipc" }

nucleo-matcher = "0.3"
ignore = "0.4"
hashbrown = "0.17"
notify = "8.2"
notify-debouncer-full = "0.7"
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
serde_json = "1.0"
interprocess = "2.4"
ashpd = { version = "0.14", default-features = false, features = ["async-io", "global_shortcuts", "notification", "open_uri"] }
global-hotkey = "0.9"
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
tray-icon = "0.26"
png = "0.18"
futures-lite = "2"
async-io = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
dirs = "7.0"
winit = { version = "0.30", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "accesskit", "default_fonts", "clipboard"] }

# Tests
rstest = "0.28"
proptest = "1.12"
insta = "1.49"
assert_fs = "1.1"
divan = "0.1"
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# Everyday optimized builds: `cargo run --release`. Fast to rebuild (a second or two).
[profile.release]
incremental = true
strip = true
panic = "abort"

# Published executables: `cargo build --profile dist` (target/dist/serafind). Slower to build,
# smaller and slightly faster.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

# Snapshot tests run faster with an optimized insta/similar.
[profile.dev.package.insta]
opt-level = 3
[profile.dev.package.similar]
opt-level = 3
