# Serafind theme: Dark.
#
# Copy this file under another name in the same folder to make your own theme, then choose it
# in config.toml (theme = "file-name-without-toml"). A theme can start from another one with
# extends = "dark" and give only the values it changes. Colors are "#rrggbb" or "#rrggbbaa".

name = "Dark"

[colors]
background = "#202020"   # the bar
surface = "#2b2b2b"      # the input, a hovered row
border = "#3a3a3a"
text = "#f2f2f2"
text_muted = "#9d9d9d"   # folders, hints, counters
accent = "#4cc2ff"       # caret, active mode, focus
selection = "#4cc2ff2e"  # the selected row
highlight = "#4cc2ff"    # matched letters
chip = "#363636"
chip_text = "#e3e3e3"
error = "#ff6b6b"        # chips that cannot be used, settings errors
shadow = "#00000066"

[font]
family = "Inter"         # "Inter" (built in), an installed font name, or a .ttf / .otf path
size = 15

[shape]
radius = 10              # corner radius of the bar, chips and rows
padding = 10
row_height = 36
shadow = true

[icons]
set = "phosphor"         # "phosphor" or "none"

[icons.colors]
folder = "#e8b54a"
document = "#5b9bd5"
pdf = "#e5534b"
image = "#58c27d"
audio = "#c678dd"
video = "#d19a66"
archive = "#a8a8a8"
code = "#61afef"
app = "#4cc2ff"
other = "#9d9d9d"
