# Serafind theme: Default Dark (the colors of PowerHive's Default Dark theme).
#
# Copy this file under another name in the same folder to make your own theme, then choose it
# in config.toml (theme = "file-name-without-toml"). A theme can start from another one with
# extends = "dark" and give only the values it changes. Colors are "#rrggbb" or "#rrggbbaa".

name = "Default Dark"
mode = "dark"            # "dark" or "light"

[colors]
primary = "#4C4C9D"
secondary = "#712F79"
tertiary = "#976391"
accent = "#F7996E"           # border of the bar, search icon, folders, matched letters
danger = "#883007"

background = "#171624"
surface = "#292538"
surface_elevated = "#353044" # the bar
surface_hover = "#3E3850"    # a hovered row, an excluded chip

text_primary = "#FFFFFF"
text_secondary = "#B7AFC1"   # folders, hints, counters, icons
text_disabled = "#6E6779"    # placeholder, completion
border = "#45404E"           # separators

selection = "#4C4C9D"        # the selected row, chips
focus = "#F7996E"            # caret

success = "#4CAF79"
warning = "#E5B45C"
error = "#D65B5B"            # chips that cannot be used, settings errors
info = "#6FA8DC"

[font]
family = "Inter"         # "Inter" (built in), an installed font name, or a .ttf / .otf path
size = 14                # the search input is a little larger

[shape]
radius = 10              # corner radius of the bar (chips and rows use less)
padding = 12
row_height = 38
shadow = true

[icons]
set = "phosphor"         # "phosphor" or "none"

# Icons use text_secondary, folders use accent. To color a kind of entry, remove the # :
[icons.colors]
# folder = "#F7996E"
# document = "#6FA8DC"
# pdf = "#D65B5B"
# image = "#4CAF79"
# audio = "#976391"
# video = "#E5B45C"
# archive = "#B7AFC1"
# code = "#6FA8DC"
# app = "#F7996E"
# other = "#B7AFC1"
