# THIRD_PARTY_LICENSES.html, shipped with every release (`cargo about generate about.hbs`): the
# licenses of the crates built into Serafind ask for their text to come with the program.
# Keep the list in line with [licenses] of deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Only what ends up in the program.
ignore-dev-dependencies = true
ignore-build-dependencies = true
